<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibrasExpress - Tradutor de Acessibilidade</title>
  <link rel="stylesheet" href="style.css">

  <!-- Bibliotecas de Visão Computacional (MediaPipe) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <header>
    <h1>🤟 LibrasExpress</h1>
    <p>Tradutor de sinais de Libras em tempo real</p>
  </header>

  <main>
    <!-- Área da Câmera -->
    <div class="video-container">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="canvas-saida"></canvas>
    </div>

    <!-- Painel com a Tradução em Texto e Botão de Áudio -->
    <div class="painel-resultado">
      <h2>Sinal Detectado:</h2>
      <div id="texto-traduzido">Aguardando sinal...</div>
      <button id="btn-falar" onclick="falarTexto()">🔊 Ouvir Novamente</button>
    </div>

    <!-- Monetização Fictícia para a Avaliação da RevenueCat -->
    <div class="card-monetizacao">
      <h3>⭐ Versão Pro</h3>
      <p>Desbloqueie o dicionário completo de Libras e frases longas.</p>
      <button class="btn-pro">Assinar Plano Premium</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
