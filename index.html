<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LibrasExpress</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header>
            <span class="emoji-logo">🤟🏿</span>
            <h1>LibrasExpress</h1>
            <p>Tradução de sinais em tempo real</p>
        </header>

        <main>
            <div id="webcam-container" class="video-box">
                <p id="camera-status">Toque no botão para ligar a câmera</p>
            </div>

            <button id="start-btn" type="button" onclick="iniciar()">
                🎥 Ligar Câmera e Tradutor
            </button>
        </main>

        <footer>
            <p>Sinal Detectado:</p>
            <h2 id="texto-traduzido">Aguardando...</h2>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
