<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibrasExpress</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Bibliotecas do Teachable Machine e TensorFlow -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>LibrasExpress</h1>
        <p class="subtitulo">Tradução de sinais em tempo real</p>

        <div class="video-box" id="webcam-container">
            <p>Toque no botão para ligar a câmera</p>
        </div>

        <button id="start-btn" onclick="iniciar()">🎥 Ligar Câmera e Tradutor</button>

        <div class="resultado-container">
            <p class="label">Sinal Detectado:</p>
            <h2 id="texto-traduzido">Aguardando...</h2>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
