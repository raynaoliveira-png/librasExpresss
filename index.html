<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibrasExpress - Tradutor de Acessibilidade</title>
  <link rel="stylesheet" href="style.css">

  <!-- Bibliotecas do TensorFlow e Teachable Machine -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body>

  <header>
    <h1>🤟 LibrasExpress</h1>
    <p>Tradutor de sinais de Libras em tempo real</p>
  </header>

  <main>
    <!-- Área da Câmera -->
    <div class="video-container">
      <div id="webcam-container"></div>
    </div>

    <!-- Painel de Resultados -->
    <div class="painel-resultado">
      <h2>Sinal Detectado:</h2>
      <div id="texto-traduzido">Carregando IA...</div>
      <button id="btn-falar" onclick="falarTexto()">🔊 Ouvir Novamente</button>
    </div>

    <!-- Monetização Fictícia -->
    <div class="card-monetizacao">
      <h3>⭐ Versão Pro</h3>
      <p>Desbloqueie o dicionário completo de Libras e frases longas.</p>
      <button class="btn-pro">Assinar Plano Premium</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
